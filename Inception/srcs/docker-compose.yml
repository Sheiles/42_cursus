services:
  nginx:
    image: nginx
    build:
      context: ./requirements/nginx
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_healthy
    ports:
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - wordpress_files:/var/www/html:ro
    networks:
      - inception

  wordpress:
    image: wordpress
    build:
      context: ./requirements/wordpress
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_HOST: mariadb
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_AUTHOR_USER: ${WP_AUTHOR_USER}
      WP_AUTHOR_EMAIL: ${WP_AUTHOR_EMAIL}
    secrets:
      - db_password
      - wp_owner_password
      - wp_editor_password
    volumes:
      - wordpress_files:/var/www/html
    networks:
      - inception
    healthcheck:
      test: ["CMD", "wp", "--allow-root", "core", "is-installed", "--path=/var/www/html"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mariadb:
    image: mariadb
    build:
      context: ./requirements/mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - database:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --protocol=socket --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_owner_password:
    file: ../secrets/wp_owner_password.txt
  wp_editor_password:
    file: ../secrets/wp_editor_password.txt

volumes:
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/mariadb
  wordpress_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wordpress

networks:
  inception:
    driver: bridge
